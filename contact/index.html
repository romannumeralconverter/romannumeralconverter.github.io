  <main id="main-content" class="site-shell">
    <section class="hero contact-panel">
      <h1 class="page-title">Contact</h1>
      <p class="page-intro">For corrections, feedback, or support requests, contact us at <a href="mailto:support@roman-numeral.org">support@roman-numeral.org</a>.</p>

      <form id="contactForm" novalidate>
        <div class="field">
          <label for="contactName">Your name</label>
          <input id="contactName" name="name" type="text" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="contactEmail">Email address</label>
          <input id="contactEmail" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="contactSubject">Subject</label>
          <input id="contactSubject" name="subject" type="text" required>
        </div>

        <div class="field">
          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" name="message" required></textarea>
        </div>

        <div class="card__actions">
          <button class="btn btn--primary" type="submit">Open Email Draft</button>
        </div>
        <div id="contactStatus" class="form-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
